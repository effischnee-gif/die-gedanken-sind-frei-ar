<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Die Gedanken sind frei – AR V1</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#audioPanel{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;display:none;align-items:center;gap:10px;background:rgba(18,12,16,.72);color:#fff;padding:10px 14px;border-radius:999px;font:15px -apple-system,BlinkMacSystemFont,sans-serif;backdrop-filter:blur(9px)}
#audioButton{border:0;border-radius:999px;padding:9px 14px;background:#fff;color:#111;font-weight:600;font-size:15px}
#status{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9998;color:white;background:rgba(20,12,17,.55);padding:7px 12px;border-radius:20px;font:13px -apple-system,BlinkMacSystemFont,sans-serif}
</style>
<script>
AFRAME.registerComponent('apparition',{
 init(){
   this.mesh=null; this.start=0;
   this.el.addEventListener('model-loaded',()=>{
     this.mesh=this.el.getObject3D('mesh');
     this.mesh.traverse(o=>{
       if(o.isMesh){
         o.material.transparent=true;
         o.material.opacity=.0;
         o.material.depthWrite=false;
         o.material.side=THREE.DoubleSide;
         o.material.needsUpdate=true;
       }
     });
   });
 },
 tick(t){
   if(!this.mesh)return;
   const s=t/1000;
   // slowly emerge from the painted surface and then remain spectral
   const cycle=.5+.5*Math.sin(s*.23-1.2);
   const opacity=.18+.42*cycle;
   this.mesh.traverse(o=>{if(o.isMesh)o.material.opacity=opacity});
   // no rotation: body remains aligned with the grave / painting
   this.el.object3D.position.z=.12+.11*cycle;
   // very small breathing: chest/body expands rather than "dancing"
   const breath=1+.018*Math.sin(s*1.25);
   this.el.object3D.scale.set(.73*breath,.73,.73*breath);
 }
});
window.addEventListener('DOMContentLoaded',()=>{
 const target=document.querySelector('#target'), panel=document.querySelector('#audioPanel');
 const btn=document.querySelector('#audioButton'), audio=document.querySelector('#narration');
 const status=document.querySelector('#status');
 target.addEventListener('targetFound',()=>{panel.style.display='flex';status.textContent='Figur wird sichtbar'});
 target.addEventListener('targetLost',()=>{status.textContent='Suche das Diptychon …';if(audio.paused)panel.style.display='none'});
 btn.addEventListener('click',async()=>{
   if(audio.paused){try{await audio.play();btn.textContent='❚❚ Pause'}catch(e){}}
   else{audio.pause();btn.textContent='▶ Anhören'}
 });
 audio.addEventListener('ended',()=>btn.textContent='▶ Noch einmal');
});
</script>
</head>
<body>
<audio id="narration" preload="auto" playsinline>
 <source src="./Die_Gedanken_sind_frei_Audio.m4a" type="audio/mp4">
</audio>
<div id="status">Suche das Diptychon …</div>
<div id="audioPanel"><button id="audioButton">▶ Anhören</button><span>Die Gedanken sind frei</span></div>

  device-orientation-permission-ui="enabled:false">

    <img id="figureRight"

         crossorigin="anonymous">

  </a-assets>

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>

  <a-entity id="target"

    <a-image

      width="0.38"

      material="shader: flat; transparent: true; opacity: 1; side: double">

    </a-image>

    <a-image

      src="#figureRight"

      position="0.215 0 0.01"

      width="0.38"

      height="0.484"

      material="shader: flat; transparent: true; opacity: 1; side: double">

    </a-image>

  </a-entity>

</a-scene>
<a-assets>

  <img id="figureLeft"

       src="./Figur_AR_links.png"

       crossorigin="anonymous">

  <img id="figureRight"

       src="./Figur_AR_rechts.png"

</a-assets>
  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>

  <!-- linke Leinwand -->

<a-image

  position="-0.235 0 0.01"

</a-image>

<!-- rechte Leinwand -->

<a-image

  src="#figureRight"

  position="0.235 0 0.01"

</a-image>

    <a-image

      src="#figureImage"

      width="0.86"

height="0.484"

    </a-image>

  </a-entity>

</a-scene>
 <a-assets>

  <img id="figureImage" src="./Figur_Die_Gedanken_sind_frei_AR.png">

</a-assets>
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
 <a-entity light="type:ambient;intensity:1.0"></a-entity>
<a-plane

  src="./Figur_Die_Gedanken_sind_frei_AR_V2_transparent.png"

  position="0 0 0.1"

  rotation="0 0 0"

  width="1"

  height="0.5625"

</a-plane>

  src="./Figur_Die_Gedanken_sind_frei_AR.png"

  position="0 0 0.1"

  rotation="0 0 0"

  width="1"

  height="0.5625"

  material="shader: flat; transparent: true; opacity: 1; side: double">

</a-plane>

 <a-entity id="target" mindar-image-target="targetIndex:0">
   <!-- Rotate into the diptych's vertical body axis; adjust after first real-world test if needed -->
   <a-gltf-model src="#figureAsset" position="0 0 .10" rotation="0 0 0" apparition></a-gltf-model>
 </a-entity>
</a-scene>
</body></html>
