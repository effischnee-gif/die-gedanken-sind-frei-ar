<!doctype html>

<html lang="de">

<head>

<meta charset="utf-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Die Gedanken sind frei – AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,body{

  margin:0;

  width:100%;

  height:100%;

  overflow:hidden;

}

#status{

  position:fixed;

  top:max(16px,env(safe-area-inset-top));

  left:50%;

  transform:translateX(-50%);

  z-index:9998;

  color:white;

  background:rgba(20,12,17,.55);

  padding:7px 12px;

  border-radius:20px;

  font:13px -apple-system,BlinkMacSystemFont,sans-serif;

  white-space:nowrap;

}

#audioPanel{

  position:fixed;

  left:50%;

  bottom:max(24px,env(safe-area-inset-bottom));

  transform:translateX(-50%);

  z-index:9999;

  display:none;

  align-items:center;

  gap:10px;

  background:rgba(18,12,16,.72);

  color:white;

  padding:10px 14px;

  border-radius:999px;

  font:15px -apple-system,BlinkMacSystemFont,sans-serif;

  backdrop-filter:blur(9px);

  -webkit-backdrop-filter:blur(9px);

}

#audioButton{

  border:0;

  border-radius:999px;

  padding:9px 14px;

  background:white;

  color:#111;

  font-weight:600;

  font-size:15px;

}

</style>

<script>

window.addEventListener('DOMContentLoaded',()=>{

  const target =

    document.querySelector('#target');

  const figure =

    document.querySelector('#figure');

  const panel =

    document.querySelector('#audioPanel');

  const button =

    document.querySelector('#audioButton');

  const audio =

    document.querySelector('#narration');

  const status =

    document.querySelector('#status');

  let fadeTimer1 = null;

  let fadeTimer2 = null;

  let targetVisible = false;

  /* FIGUREN-ANIMATION */

  function startFigureCycle(){

    if(!targetVisible) return;

    clearTimeout(fadeTimer1);

    clearTimeout(fadeTimer2);

    /* Figur zunächst unsichtbar */

    figure.setAttribute(

      'material',

      'opacity',

      0

    );

    /* langsam erscheinen */

    figure.emit('fadeIn');

    /*

      5 Sekunden erscheinen

      + 4 Sekunden sichtbar

    */

    fadeTimer1 = setTimeout(()=>{

      if(targetVisible){

        figure.emit('fadeOut');

      }

    },9000);

    /*

      weitere 5 Sekunden verschwinden,

      danach neuer Zyklus

    */

    fadeTimer2 = setTimeout(()=>{

      if(targetVisible){

        startFigureCycle();

      }

    },14000);

  }

  /* TARGET ERKANNT */

  target.addEventListener('targetFound',()=>{

    targetVisible = true;

    status.textContent =

      'Figur wird sichtbar';

    panel.style.display =

      'flex';

    startFigureCycle();

  });

  /* TARGET VERLOREN */

  target.addEventListener('targetLost',()=>{

    targetVisible = false;

    clearTimeout(fadeTimer1);

    clearTimeout(fadeTimer2);

    figure.setAttribute(

      'material',

      'opacity',

      0

    );

    status.textContent =

      'Suche das Diptychon …';

    if(audio.paused){

      panel.style.display='none';

    }

  });

  /* AUDIO */

  button.addEventListener('click',async()=>{

    if(audio.paused){

      try{

        await audio.play();

        button.textContent =

          '❚❚ Pause';

      }

      catch(error){

        console.log(

          'Audio konnte nicht gestartet werden.',

          error

        );

      }

    }

    else{

      audio.pause();

      button.textContent =

        '▶ Anhören';

    }

  });

  audio.addEventListener('ended',()=>{

    button.textContent =

      '▶ Noch einmal';

  });

});

</script>

</head>

<body>

<audio

  id="narration"

  preload="auto"

  playsinline>

  <source

    src="./Die_Gedanken_sind_frei_Audio.m4a"

    type="audio/mp4">

</audio>

<div id="status">

  Suche das Diptychon …

</div>

<div id="audioPanel">

  <button id="audioButton">

    ▶ Anhören

  </button>

  <span>

    Die Gedanken sind frei

  </span>

</div>

<a-scene

  mindar-image="

    imageTargetSrc: ./targets.mind;

    maxTrack: 1;

    uiLoading: yes;

    uiScanning: yes;

    uiError: yes"

  color-space="sRGB"

  renderer="colorManagement: true"

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false">

  <a-assets>

    <img

      id="figureFinal"

      src="./Figur_AR_final.png"

      crossorigin="anonymous">

  </a-assets>

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>

  <a-entity

    id="target"

    mindar-image-target="targetIndex:0">

    <a-image

  id="figure"

  src="#figureFinal"

  position="0 0.105 0.01"

  width="0.43"

  height="0.242"
</a-image>

  </a-entity>

</a-scene>

</body>

</html>
